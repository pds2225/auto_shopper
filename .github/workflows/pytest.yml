name: pytest

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --upgrade pip && python -m pip install pytest>=8.0

      - name: Compile scripts
        run: python -m py_compile scripts/*.py

      - name: Run unit tests
        run: python -m pytest -q
